services:
  postgres:
    image: postgres:16-alpine
    container_name: textlive-postgres
    environment:
      POSTGRES_USER: textlive
      POSTGRES_PASSWORD: textlive
      POSTGRES_DB: textlive
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - textlive-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U textlive"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: textlive-backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
    environment:
      - NODE_ENV=development
      - PORT=3001
      - CORS_ORIGIN=*
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=textlive
      - DB_PASSWORD=textlive
      - DB_DATABASE=textlive
      - DB_SYNCHRONIZE=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - textlive-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: textlive-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
    environment:
      - NODE_ENV=development
      - VITE_API_TARGET=http://backend:3001
    depends_on:
      - backend
    networks:
      - textlive-network

volumes:
  postgres_data:

networks:
  textlive-network:
    driver: bridge
